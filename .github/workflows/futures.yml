name: 코인 선물 모의투자·금리 갱신 (4시간마다)

on:
  workflow_dispatch:
    inputs:
      ping:
        description: 'AI 3개 연결만 시험 (매매 안 함)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: futures
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 알림 발송 도구 설치
        run: npm install --no-audit --no-fund
      - name: AI 회의 연결 시험
        if: ${{ inputs.ping }}
        run: node connect/council.mjs --ping
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      - name: FLUX 선물 모의투자
        if: ${{ !inputs.ping }}
        run: node connect/futures.mjs
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_EMAIL: ${{ secrets.VAPID_EMAIL }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      - name: 금리·물가 자동 갱신 (ECOS·FRED)
        if: ${{ !inputs.ping }}
        run: node connect/policy-run.mjs
        continue-on-error: true
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_EMAIL: ${{ secrets.VAPID_EMAIL }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: 결과 저장
        if: ${{ !inputs.ping }}
        run: |
          git config user.name "sijangnalssi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/futures-state.json data/futures-live.json
          git add data/policy-state.json data/policy-live.json 2>/dev/null || true
          git commit -m "선물 모의투자 $(date -u +'%F %H:%M')" || echo "변경 없음"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
