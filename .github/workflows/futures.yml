name: 코인 선물 모의투자 (4시간마다)

on:
  schedule:
    - cron: '7 0,4,8,12,16,20 * * *'   # 4시간봉 마감 7분 뒤 (UTC) — 주말에도 돌아감
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: futures
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 알림 발송 도구 설치
        run: npm install --no-audit --no-fund
      - name: FLUX 선물 모의투자
        run: node connect/futures.mjs
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_EMAIL: ${{ secrets.VAPID_EMAIL }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
      - name: 결과 저장
        run: |
          git config user.name "sijangnalssi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/futures-state.json data/futures-live.json
          git commit -m "선물 모의투자 $(date -u +'%F %H:%M')" || echo "변경 없음"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
